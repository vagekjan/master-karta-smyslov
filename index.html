<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Блок I · Что меняется · мастер-презентация смыслов</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2317161A'/%3E%3Cpath d='M9 22c0-7 5-12 9-12 2.6 0 4 1.7 4 3.8 0 3.4-3.4 5.2-6.4 5.2-2.2 0-4-1-4.6-2.6' stroke='%23F2B600' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --s1:#FBFAF7; --s2:#F4F2ED; --s3:#EFEDE8;
  --ink:#17161A; --d2:#211F1B; --d3:#3A3833; --d4:#5D5A52;
  --ink2:#4A4D52; --muted:#8C8677; --rule:#E7E3D8;
  --accent:#F2B600; --accent-ink:#8A5A12; --green:#2F5A2A;
  --red:#A3342B; --violet:#5B3E8E;
  --disp:'Oswald',sans-serif; --sans:'Golos Text',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--s1);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* шапка */
.top{flex:none;display:flex;align-items:center;gap:14px;padding:9px 20px;background:#fff;border-bottom:1px solid var(--rule)}
.brand{font-family:var(--disp);font-weight:600;font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.brand em{font-style:normal;color:var(--muted);font-weight:400}
.top .sp{flex:1}
.toggle{flex:none;display:flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden}
.toggle button{font-family:var(--disp);font-weight:500;font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;padding:5px 12px;background:#fff;color:var(--ink);border:none;cursor:pointer}
.toggle button.on{background:var(--ink);color:#fff}
.burger{flex:none;width:26px;height:26px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 3px;background:none;border:none;cursor:pointer}
.burger span{display:block;height:1.5px;background:var(--ink);border-radius:1px;transition:background .12s}
body.navopen .burger span{background:var(--accent-ink)}

/* каркас */
.main{flex:1;display:flex;min-height:0}
.stagewrap{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;min-height:0;padding:20px;background:var(--ink)}
.stage{width:min(100%, calc((100vh - 136px) * 1.777));aspect-ratio:16/9;max-height:100%;background:var(--bg);border-radius:6px;box-shadow:0 20px 64px rgba(0,0,0,.5);position:relative;overflow:hidden;container-type:inline-size}
.slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:7.2cqw}
.slide.active{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* мета */
.loc{position:absolute;top:4.2cqw;left:7.2cqw;right:7.2cqw;display:flex;align-items:baseline;gap:14px}
.loc .ch{font-family:var(--mono);font-size:clamp(8px,1.42cqw,11px);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.loc .cd{font-family:var(--mono);font-size:clamp(8px,1.42cqw,11px);letter-spacing:.14em;color:#C9C4B6;margin-left:auto}
.kick{font-family:var(--mono);font-size:clamp(8px,1.42cqw,11px);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}

/* display */
.dsp{font-family:var(--disp);font-weight:700;text-transform:uppercase;
     font-size:clamp(20px,7.6cqw,112px);line-height:1.05;letter-spacing:-.018em;margin:0;color:var(--ink)}
.dsp b{font-weight:700;color:var(--accent)}
.dsp .m{color:#B4AF9F;font-weight:500}
.slide.dark .dsp .m{color:var(--d4)}
.dsp.sm{font-size:clamp(17px,5.3cqw,72px);line-height:1.02}
.dsp.xs{font-size:clamp(15px,4.1cqw,56px);line-height:1.04}
.bd{font-family:var(--sans);font-size:clamp(10px,1.72cqw,16px);line-height:1.52;color:var(--ink2);margin:4.4cqw 0 0;max-width:44ch}
.bd b{font-weight:600;color:var(--ink)}
.note{font-family:var(--sans);font-size:clamp(9px,1.45cqw,13px);line-height:1.5;color:var(--muted);margin:3.4cqw 0 0;max-width:52ch}

.slide.display{justify-content:center;align-items:flex-start}
.slide.display .dsp,.slide.guard .dsp{max-width:100%}
.slide.display.solo .dsp{max-width:100%}
.slide.question .q{max-width:100%}
.slide.terms .dsp.xs{max-width:32ch}
.slide.terms.col .dsp{font-size:clamp(20px,7.6cqw,110px);max-width:100%}
.slide.guard{justify-content:center;align-items:flex-start}
.slide.guard .dsp{max-width:12ch;font-size:clamp(22px,8.6cqw,128px)}
.slide.guard .negs{display:flex;gap:5cqw;margin-top:5cqw;flex-wrap:wrap}
.slide.guard .neg{font-family:var(--disp);font-weight:600;text-transform:uppercase;font-size:clamp(11px,2.1cqw,20px);letter-spacing:.02em;color:var(--ink2);padding-top:1.6cqw;border-top:2px solid var(--ink)}

/* 01 накопление */
.slide.accum{justify-content:center;align-items:flex-start}

/* 03 контраст одного объекта */
.slide.struct .row{display:grid;grid-template-columns:1fr 1px 1fr;margin-top:3cqw;align-items:start}
.slide.struct .vr{background:var(--rule);height:100%;min-height:30cqw}
.slide.struct .cell{padding:0 5cqw}
.slide.struct .cell:first-child{padding-left:0}
.slide.struct .cell:last-child{padding-right:0}
.slide.struct .ct{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:clamp(13px,3.2cqw,42px);line-height:1.02;letter-spacing:-.015em;margin-bottom:3.4cqw}
.slide.struct .cell.acc .ct{color:var(--accent-ink)}
.box{width:22cqw;height:22cqw;border:1.5px solid var(--ink);border-radius:2cqw;padding:2cqw;display:grid;gap:1.2cqw}
.box.g1{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.box.g1 i{background:var(--s3);border-radius:.5cqw}
.box.g2{place-items:center;border-radius:11cqw}
.ring{width:100%;height:100%;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center}
.ring i{width:52%;height:52%;border:1.5px solid var(--accent-ink);border-radius:50%;display:block}
.slide.struct .cap{font-family:var(--sans);font-size:clamp(9px,1.5cqw,14px);line-height:1.5;color:var(--ink2);margin-top:3cqw;max-width:26ch}

/* 06 типографическое поле */
.slide.field{justify-content:center;align-items:flex-start}
.slide.field .fwrap{display:grid;grid-template-columns:1.15fr .85fr;gap:6cqw;align-items:center;width:100%}
.slide.field .items{display:flex;flex-direction:column;gap:1.9cqw}
.slide.field .it{font-family:var(--sans);font-size:clamp(9px,1.66cqw,16px);color:var(--ink2);line-height:1.34;position:relative;padding-left:2.2cqw}
.slide.field .it::before{content:'';position:absolute;left:0;top:.62em;width:1.1cqw;height:1px;background:#C9C4B6}
.slide.field .it:nth-child(1){margin-left:0}
.slide.field .it:nth-child(2){margin-left:1.4cqw}
.slide.field .it:nth-child(3){margin-left:2.8cqw}
.slide.field .it:nth-child(4){margin-left:4.2cqw}
.slide.field .it:nth-child(5){margin-left:5.6cqw}
.slide.field .it:nth-child(6){margin-left:7cqw;color:var(--ink);font-weight:600}
.slide.field .it:nth-child(6)::before{background:var(--accent);height:2px}

/* 07 школы */
.slide.schools .dsp{font-size:clamp(13px,3.4cqw,46px);line-height:1.02;max-width:20ch}
.slide.schools .rows{margin-top:3.2cqw;display:flex;flex-direction:column}
.slide.schools .note{margin-top:2.4cqw}
.slide.schools .r{display:grid;grid-template-columns:20cqw 1fr;gap:3cqw;padding:1.5cqw 0;border-top:1px solid var(--rule);align-items:baseline}
.slide.schools .r:last-child{border-bottom:1px solid var(--rule)}
.slide.schools .nm{font-family:var(--disp);font-weight:600;text-transform:uppercase;font-size:clamp(10px,2cqw,19px);letter-spacing:.01em}
.slide.schools .sb{font-family:var(--sans);font-size:clamp(9px,1.55cqw,14px);color:var(--ink2)}

/* карта логик: территория, не шкала */
.band{display:grid;grid-template-columns:repeat(7,1fr);width:100%;background:var(--s2);border-radius:1.2cqw;overflow:hidden;margin-top:4cqw}
.band .cell{padding:4.4cqw 1.4cqw;border-left:1px solid #E1DDD0;display:flex;align-items:center;justify-content:center;text-align:center;min-height:11cqw}
.band .cell:first-child{border-left:none}
.band .cell .n{font-family:var(--disp);font-weight:600;text-transform:uppercase;font-size:clamp(10px,2.05cqw,21px);line-height:1.1;letter-spacing:-.005em;color:var(--ink)}
.band.zoom .cell{background:transparent}
.band.zoom .cell.dim{padding:4.4cqw .8cqw}
.band.zoom .cell.dim .n{color:#C2BCAA;font-weight:400;font-size:clamp(8px,1.5cqw,14px)}
.band.zoom .cell.hot{background:#FDF3D2}
.band.zoom .cell.hot .n{font-size:clamp(13px,3.05cqw,34px);color:var(--ink);font-weight:700}
.slide.map{justify-content:center}
.slide.map .mt{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:clamp(14px,3.6cqw,50px);line-height:1.04;margin:0;letter-spacing:-.015em}
.slide.map .mt b{color:var(--accent-ink)}


/* 15 формула */
.slide.formula .fx{display:flex;align-items:center;gap:3.4cqw;margin-top:5.4cqw;flex-wrap:wrap}
.slide.formula .fx span{font-family:var(--disp);font-weight:600;text-transform:uppercase;font-size:clamp(12px,2.7cqw,32px);letter-spacing:-.01em;color:var(--ink)}
.slide.formula .fx .eq{font-size:clamp(16px,3.6cqw,44px);color:var(--accent-ink);font-weight:700}

/* вопрос */
.slide.question{justify-content:center;align-items:flex-start}
.slide.question .qline{width:7cqw;height:3px;background:var(--green);margin-bottom:4.4cqw}
.slide.question .q{font-family:var(--disp);font-weight:600;text-transform:uppercase;color:var(--green);
   font-size:clamp(18px,6.2cqw,88px);line-height:1.02;max-width:19ch;letter-spacing:-.012em;margin:0}
.slide.question .nx{font-family:var(--mono);font-size:clamp(8px,1.42cqw,11px);letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-top:5cqw}

/* тёмная сцена */
.slide.dark{background:var(--ink)}
.slide.dark .dsp,.slide.dark .st{color:#fff}
.slide.dark .dsp b{color:var(--accent)}
.slide.dark .bd{color:#C9C4B6}
.slide.dark .bd b{color:#fff}
.slide.dark .note{color:var(--d4)}
.slide.dark .loc .ch,.slide.dark .kick{color:var(--muted)}
.slide.dark .loc .cd{color:var(--d4)}


/* вход: непрерывный апгрейд */
.slide.accum .alines{display:flex;flex-direction:column;margin-top:3.4cqw}
.slide.accum .st{font-family:var(--disp);font-weight:700;text-transform:uppercase;line-height:.98;letter-spacing:-.018em;margin:0;display:block;color:var(--ink)}
.slide.accum.fade .st.a{font-size:clamp(20px,7.6cqw,112px)}
.slide.accum.fade .st.b{font-size:clamp(17px,6.3cqw,92px);opacity:.86}
.slide.accum.fade .st.c{font-size:clamp(15px,5.2cqw,76px);opacity:.66}
.slide.accum.equal .alines{gap:.5cqw}
.slide.accum.equal .alines{margin-top:0}
.slide.accum.equal .st{line-height:1.06;opacity:1}
.slide.accum.equal .st:nth-child(1){font-size:clamp(14px,4.2cqw,58px);color:#9A948A}
.slide.accum.equal .st:nth-child(2){font-size:clamp(15px,4.6cqw,64px);color:#807A70}
.slide.accum.equal .st:nth-child(3){font-size:clamp(16px,5.0cqw,70px);color:#63605A}
.slide.accum.equal .st:nth-child(4){font-size:clamp(17px,5.5cqw,77px);color:#3A3833}
.slide.accum.equal .st:last-child{font-size:clamp(19px,6.4cqw,90px);color:var(--ink);margin-top:2cqw}
.slide.dark.accum .st{color:#fff}

/* Т1: тезис плюс два определения */
.slide.defs{justify-content:center}
.slide.defs .dwrap{display:grid;grid-template-columns:1fr 1px 1fr;margin-top:6.4cqw;align-items:start}
.slide.defs.solo .dwrap{margin-top:0}
.slide.defs.solo .dl{font-size:clamp(9px,1.6cqw,13px);margin-bottom:3.4cqw}
.slide.defs.solo .dt{font-size:clamp(13px,2.5cqw,26px);line-height:1.38}
.slide.defs.solo .vr{min-height:26cqw}
.slide.defs .vr{background:var(--rule);height:100%;min-height:13cqw}
.slide.defs .dc{padding:0 5.4cqw}
.slide.defs .dc:first-child{padding-left:0}
.slide.defs .dc:last-child{padding-right:0}
.slide.defs .dl{font-family:var(--mono);font-size:clamp(8px,1.4cqw,11px);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:2cqw}
.slide.defs .dt{font-family:var(--sans);font-size:clamp(11px,1.92cqw,18px);line-height:1.52;color:var(--ink2);margin:0}
.slide.defs .dt b{color:var(--ink);font-weight:600}
.slide.dark.defs .dt{color:#C9C4B6}
.slide.dark.defs .dt b{color:#fff}
.slide.dark.defs .vr{background:var(--d3)}


/* Т4б: что может меняться */
.slide.formula .flist{display:grid;grid-template-columns:1fr 1fr;gap:1.5cqw 5cqw;margin-top:4cqw;max-width:74ch}
.slide.formula .fi{font-family:var(--sans);font-size:clamp(10px,1.66cqw,16px);color:var(--ink2);line-height:1.4}
.slide.formula .fi::before{content:'';display:inline-block;width:5px;height:5px;background:var(--accent);border-radius:50%;margin-right:10px;vertical-align:middle}

/* формула Достигателя */
.slide .chain{display:flex;align-items:center;gap:2.2cqw;flex-wrap:wrap;margin-top:5cqw}
.slide .chain span{font-family:var(--disp);font-weight:600;text-transform:uppercase;font-size:clamp(11px,2.4cqw,28px);letter-spacing:.01em;color:var(--ink)}
.slide .chain i{font-style:normal;color:var(--accent);font-size:clamp(11px,2.2cqw,25px)}
.slide.dark .chain span{color:#fff}



/* Т4б: компактное поле терминов */
.slide.terms .tw{display:flex;flex-wrap:wrap;gap:1.8cqw 4.6cqw;margin-top:6cqw;max-width:80ch}
.slide.terms .tt{font-family:var(--disp);font-weight:500;text-transform:uppercase;font-size:clamp(11px,2.3cqw,26px);letter-spacing:.005em;color:var(--ink2)}
.slide.terms .tt:nth-child(odd){color:var(--ink)}
.slide.terms.col .tw{flex-direction:column;gap:1.5cqw;max-width:100%;margin-top:5.4cqw}
.slide.terms.col .tt{font-size:clamp(13px,3.2cqw,38px);color:var(--ink2)}
.slide.terms.col .tt:nth-child(odd){color:var(--ink2)}

/* реестр исследователей */
.slide.roster{justify-content:center}
.slide.roster .lead{font-family:var(--sans);font-size:clamp(11px,1.98cqw,19px);line-height:1.5;color:var(--ink2);margin:0 0 9cqw;max-width:44ch}
.slide.roster .lead b{color:var(--ink);font-weight:600}
.slide.roster .rg{display:grid;grid-template-columns:1fr 1fr;column-gap:9cqw}
.slide.roster .rr{padding:2.5cqw 0;border-top:1px solid var(--rule)}
.slide.roster .col .rr:last-child{border-bottom:1px solid var(--rule)}
.slide.roster .rn{font-family:var(--disp);font-weight:600;text-transform:uppercase;font-size:clamp(12px,2.62cqw,30px);line-height:1.02;letter-spacing:-.008em;color:var(--ink)}

/* горизонтальное развитие: три ясных уровня */
.slide.hor{justify-content:center}
.slide.hor .dsp{max-width:100%}
.slide.hor .strip{display:flex;flex-wrap:wrap;gap:1.2cqw 3.6cqw;margin-top:4.6cqw}
.slide.hor .strip span{font-family:var(--mono);font-size:clamp(9px,1.5cqw,13px);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.slide.hor .close{font-family:var(--sans);font-weight:600;font-size:clamp(12px,2.15cqw,21px);line-height:1.42;color:var(--ink);margin:4.6cqw 0 0;max-width:38ch;padding-top:3.4cqw;border-top:1px solid var(--rule)}

/* полноэкранный образ */
/* кадр с собственной пропорцией: вписываем по высоте, поля остаются холстом */
.slide.card{padding:0;justify-content:center;align-items:center;background:var(--bg)}
.slide.card img{height:100%;width:auto;max-width:100%;object-fit:contain;display:block}
.slide.card .loc{display:none}
.slide.full{padding:0;justify-content:stretch}
.slide.full img{width:100%;height:100%;object-fit:cover;display:block}
.slide.full .loc{display:none}

/* приближение участка карты */
.slide.zoomrow{justify-content:center}
.slide.zoomrow .dsp{max-width:100%}
.slide.zoomrow .zrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 2.6cqw;margin-top:8cqw}
.slide.zoomrow .zn{font-family:var(--disp);text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.slide.zoomrow .zn.dim{font-weight:400;font-size:clamp(9px,1.62cqw,15px);color:#C9C4B6}
.slide.zoomrow .zn.hot{font-weight:700;font-size:clamp(14px,3.6cqw,44px);color:var(--ink)}
.slide.zoomrow .zcap{display:flex;align-items:center;gap:1.8cqw;flex-wrap:wrap;margin-top:6cqw;padding-top:3.2cqw;border-top:1px solid var(--rule)}
.slide.zoomrow .zcap span{font-family:var(--mono);font-size:clamp(9px,1.48cqw,13px);letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
.slide.zoomrow .zcap i{font-style:normal;color:var(--accent);font-size:clamp(10px,1.7cqw,15px)}

/* короткий тезис-коррекция */
.slide.claim{justify-content:flex-start;align-items:flex-start}
.slide.claim .dsp{max-width:66%;font-size:clamp(21px,8.9cqw,118px);line-height:.97;margin-top:8.4cqw}
.slide.claim .dsp .y{color:var(--accent)}

/* три предохранителя типографикой, без карточек */
.slide.read3{justify-content:center}
.slide.read3 .dsp{max-width:100%}
.slide.read3 .r3{display:grid;grid-template-columns:repeat(3,1fr);column-gap:7cqw;margin-top:8cqw}
.slide.read3 .r3 .b{border-top:1px solid var(--rule);padding-top:2.8cqw}
.slide.read3 .r3 .t{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:clamp(10px,2.15cqw,23px);letter-spacing:.005em;color:var(--ink);line-height:1.12}
.slide.read3 .r3 .t b{color:var(--accent);font-weight:700}
.slide.read3 .r3 .d{font-family:var(--sans);font-size:clamp(9px,1.58cqw,15px);line-height:1.46;color:var(--ink2);margin-top:1.8cqw}

/* цепочка зависимости, редакционная лесенка */
.slide.steps{justify-content:center}
.slide.steps .dsp{max-width:100%}
.slide.steps .sw{margin-top:7cqw;border-left:1px solid var(--rule);padding-left:3.6cqw}
.slide.steps .si{position:relative;padding:1.7cqw 0;font-family:var(--disp);font-weight:500;text-transform:uppercase;letter-spacing:.005em;line-height:1.1;color:var(--ink2)}
.slide.steps .si::before{content:'';position:absolute;left:-3.6cqw;top:calc(1.7cqw + .5em);width:2.4cqw;height:1px;background:var(--rule)}
.slide.steps .si:nth-child(1){font-size:clamp(11px,2.2cqw,22px);margin-left:0}
.slide.steps .si:nth-child(2){font-size:clamp(11px,2.4cqw,25px);margin-left:2.4cqw}
.slide.steps .si:nth-child(3){font-size:clamp(12px,2.6cqw,28px);margin-left:4.8cqw}
.slide.steps .si:nth-child(4){font-size:clamp(13px,2.95cqw,33px);margin-left:7.2cqw;color:var(--ink);font-weight:700}
.slide.steps .si:nth-child(4)::before{background:var(--accent);height:2px}

/* два смысловых уровня */
.slide.optic{justify-content:center}
.slide.optic .dsp{max-width:100%}
.slide.optic .lvl2{font-family:var(--disp);font-weight:500;text-transform:uppercase;
  font-size:clamp(12px,2.85cqw,33px);line-height:1.1;letter-spacing:-.005em;color:var(--ink2);
  margin-top:6cqw;padding-top:3.4cqw;border-top:1px solid var(--rule);max-width:26ch}
.slide.optic .lvl2 b{color:var(--ink);font-weight:700}
.slide.dark.optic .lvl2{color:#C9C4B6;border-color:var(--d3)}
.slide.dark.optic .lvl2 b{color:#fff}
.slide.optic .attrow{display:flex;align-items:center;gap:2.8cqw;margin-top:6cqw;padding-top:3.4cqw;border-top:1px solid var(--rule)}
.slide.dark.optic .attrow{border-color:var(--d3)}
.slide.optic .attrow img{width:9.2cqw;height:9.2cqw;object-fit:cover;object-position:50% 45%;border-radius:50%;flex:none;filter:grayscale(1) contrast(1.05)}
.slide.optic .attrow .cap{font-family:var(--mono);font-size:clamp(9px,1.5cqw,13px);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);line-height:1.5}

/* смена вопроса: тихий и громкий */
.slide.swap{justify-content:center}
.slide.swap .pre{font-family:var(--mono);font-size:clamp(9px,1.48cqw,13px);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:3cqw}
.slide.swap .q1{font-family:var(--disp);font-weight:500;text-transform:uppercase;font-size:clamp(12px,2.6cqw,29px);line-height:1.08;color:#B4AF9F;margin:0}
.slide.swap .rule{height:1px;background:var(--rule);margin:4.4cqw 0;max-width:62%}
.slide.swap .q2{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:clamp(17px,5.4cqw,74px);line-height:.98;letter-spacing:-.015em;color:var(--ink);margin:0;max-width:16ch}
.slide.swap .q2 b{color:var(--accent)}

/* ловушка: знак неравенства как центр */
.slide.trap{justify-content:center}
.slide.trap .dsp{max-width:100%}
.slide.trap .neq{display:flex;align-items:center;gap:3.4cqw;flex-wrap:wrap;margin-top:7cqw;padding-top:4cqw;border-top:1px solid var(--rule)}
.slide.trap .neq .w{font-family:var(--disp);font-weight:600;text-transform:uppercase;font-size:clamp(12px,2.7cqw,31px);letter-spacing:.005em;color:var(--ink)}
.slide.trap .neq .w.m{color:var(--muted);font-weight:500}
.slide.trap .neq .s{font-family:var(--disp);font-weight:700;font-size:clamp(20px,6.2cqw,84px);color:var(--accent);line-height:1}

/* поле смыслов вокруг тезиса */
.slide.field6{justify-content:center}
.slide.field6 .dsp{max-width:100%}
.slide.field6 .fw{display:flex;flex-wrap:wrap;align-items:baseline;gap:2.4cqw 5.2cqw;margin-top:7cqw;max-width:92%}
.slide.field6 .fw span{font-family:var(--disp);font-weight:500;text-transform:uppercase;letter-spacing:.005em;line-height:1;color:var(--ink2)}
.slide.field6 .fw span:nth-child(1){font-size:clamp(12px,2.7cqw,31px)}
.slide.field6 .fw span:nth-child(2){font-size:clamp(13px,3.1cqw,36px);color:var(--ink)}
.slide.field6 .fw span:nth-child(3){font-size:clamp(11px,2.5cqw,28px)}
.slide.field6 .fw span:nth-child(4){font-size:clamp(13px,3cqw,34px);color:var(--ink)}
.slide.field6 .fw span:nth-child(5){font-size:clamp(11px,2.45cqw,27px)}
.slide.field6 .fw span:nth-child(6){font-size:clamp(13px,3.2cqw,38px);color:var(--ink)}

/* поле внутренних вопросов */
.slide.qfield{justify-content:center}
.slide.qfield .dsp{max-width:100%}
.slide.qfield .qw{display:flex;flex-direction:column;align-items:flex-start;gap:1.1cqw;margin-top:6cqw}
.slide.qfield.noh .kick{margin-bottom:0}
.slide.qfield.noh .qw{margin-top:4.4cqw;gap:1.5cqw}
.slide.qfield.noh .qw span:nth-child(1){font-size:clamp(13px,3.0cqw,36px)}
.slide.qfield.noh .qw span:nth-child(2){font-size:clamp(14px,3.3cqw,40px)}
.slide.qfield.noh .qw span:nth-child(3){font-size:clamp(15px,3.6cqw,44px)}
.slide.qfield.noh .qw span:nth-child(4){font-size:clamp(16px,4.05cqw,50px)}
.slide.qfield.noh .qw span:nth-child(5){font-size:clamp(18px,4.5cqw,56px)}
.slide.qfield .qw span{font-family:var(--disp);font-weight:600;text-transform:uppercase;letter-spacing:.005em;line-height:1.08;white-space:nowrap}
.slide.qfield .qw span:nth-child(1){font-size:clamp(11px,2.5cqw,28px);color:#A39D92}
.slide.qfield .qw span:nth-child(2){font-size:clamp(12px,2.72cqw,31px);color:#8A847A}
.slide.qfield .qw span:nth-child(3){font-size:clamp(12px,2.96cqw,34px);color:#6E6960}
.slide.qfield .qw span:nth-child(4){font-size:clamp(13px,3.22cqw,37px);color:#3A3833}
.slide.qfield .qw span:nth-child(5){font-size:clamp(14px,3.6cqw,42px);color:var(--ink);font-weight:700}

/* две половины одной мысли */
.slide.halves{justify-content:center}
.slide.halves .h1{font-family:var(--disp);font-weight:500;text-transform:uppercase;font-size:clamp(13px,3.1cqw,38px);line-height:1.08;letter-spacing:-.01em;color:#8C8677;margin:0;max-width:100%}
.slide.halves .rule{height:1px;background:var(--d3);margin:4.4cqw 0;width:100%}
.slide.halves .h2x{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:clamp(17px,5.1cqw,70px);line-height:1.05;letter-spacing:-.015em;color:#fff;margin:0;max-width:100%}
.slide.halves .h2x b{color:var(--accent)}

/* приближение: ответ вместо технической схемы */
.slide.zoomrow .ctx{display:flex;flex-wrap:wrap;gap:0 2.2cqw;margin-bottom:7cqw}
.slide.zoomrow .ctx span{font-family:var(--mono);font-size:clamp(8px,1.4cqw,12px);letter-spacing:.14em;text-transform:uppercase;color:#C9C4B6}
.slide.zoomrow .ctx span.on{color:var(--muted)}
.slide.zoomrow .path{display:flex;flex-direction:column;gap:1.4cqw}
.slide.zoomrow .path .p{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:clamp(17px,5.2cqw,72px);line-height:1;letter-spacing:-.015em;color:var(--ink);display:flex;align-items:baseline;gap:2.4cqw}
.slide.zoomrow .path .p u{text-decoration:none;font-family:var(--mono);font-weight:500;
  font-size:clamp(10px,2.1cqw,23px);letter-spacing:.04em;color:var(--muted)}
.slide.zoomrow .path .ar{font-family:var(--disp);font-weight:400;font-size:clamp(13px,3.4cqw,44px);color:var(--accent);line-height:.8;margin-left:.6cqw}

/* формула неравенства во весь экран */
.slide.neqbig{justify-content:center;align-items:flex-start}
.slide.neqbig .kick{margin-bottom:5cqw}
.slide.neqbig .nb{display:flex;flex-direction:column;align-items:flex-start;gap:.4cqw}
.slide.neqbig .nb .w{font-family:var(--disp);font-weight:700;text-transform:uppercase;
  font-size:clamp(18px,6.4cqw,88px);line-height:1.04;letter-spacing:-.018em;color:var(--ink)}
.slide.neqbig.sm .nb .w{font-size:clamp(16px,5.4cqw,74px);line-height:1.06}
.slide.neqbig.sm .nb .s{font-size:clamp(18px,6.2cqw,84px)}
.slide.neqbig .nb .s{font-family:var(--disp);font-weight:700;font-size:clamp(20px,7.2cqw,100px);
  line-height:1;color:var(--accent);margin:.6cqw 0}
.slide.neqbig .nb .s.word{text-transform:uppercase;letter-spacing:-.015em}

/* фотофон с текстом по левой стороне */
.slide.halves.photo{background-size:cover;background-position:center}
.slide.halves.photo::before{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(23,22,26,.95) 0%,rgba(23,22,26,.92) 24%,rgba(23,22,26,.78) 34%,rgba(23,22,26,.34) 44%,rgba(23,22,26,.10) 54%,rgba(23,22,26,0) 66%)}
.slide.halves.photo>*{position:relative;z-index:1}
.slide.halves.photo .h1{max-width:44%;font-size:clamp(11px,2.35cqw,27px)}
.slide.halves.photo .rule{width:44%;margin:3.6cqw 0}
.slide.halves.photo .h2x{max-width:44%;font-size:clamp(15px,3.7cqw,50px);line-height:1.06}

/* две смысловые территории */
.slide.terr .hd{font-family:var(--disp);font-weight:700;text-transform:uppercase;
  font-size:clamp(15px,4.4cqw,60px);line-height:1.05;letter-spacing:-.015em;color:var(--ink);margin:0 0 7cqw}
.slide.terr.plain .vr{min-height:0}
.slide.terr.plain .t{font-size:clamp(13px,3.0cqw,38px)}
.slide.terr.plain .ls{margin-top:3.4cqw;gap:2.1cqw}
.slide.terr.plain .ls span{font-size:clamp(11px,2.35cqw,26px);line-height:1.25;color:var(--ink2)}
.slide.terr.plain .ls span::before{top:.66em;width:1.8cqw;max-width:20px;background:#B4AF9F}
.slide.terr .sub:empty{display:none}

/* внутренний процесс: тихая подводка + две крупные реплики */
.slide.inner{justify-content:center;align-items:flex-start}
.slide.inner .lead{font-family:var(--disp);font-weight:500;text-transform:uppercase;
  font-size:clamp(12px,3.3cqw,44px);line-height:1.08;letter-spacing:-.01em;color:#B4AF9F;margin:0}
.slide.inner .qs{display:flex;flex-direction:column;align-items:flex-start;gap:.22em;margin-top:5.6cqw;
  font-family:var(--disp);font-weight:700;text-transform:uppercase;
  font-size:clamp(16px,7.0cqw,104px);line-height:1.04;letter-spacing:-.015em;color:var(--ink)}
.slide.inner .qs span{font-size:1em}

/* реплика из зала: другой голос, поэтому Golos, не капс */
.slide.voice{justify-content:center;align-items:flex-start}
.slide.voice .vw{border-left:2px solid var(--ink);padding-left:4.4cqw;max-width:88%}
.slide.voice .vm{font-family:var(--mono);font-size:clamp(8px,1.42cqw,11px);letter-spacing:.24em;
  text-transform:uppercase;color:var(--muted);margin-bottom:3.4cqw}
.slide.voice .vt{font-family:var(--sans);font-weight:500;
  font-size:clamp(14px,4.7cqw,66px);line-height:1.26;color:var(--ink);margin:0}

/* два равноправных примера */
.slide.pair{justify-content:center}
.slide.pair .pg{display:grid;grid-template-columns:1fr 1px 1fr}
.slide.pair .vr{background:var(--rule);min-height:24cqw}
.slide.pair .pc{padding:0 6.4cqw}
.slide.pair .pc:first-child{padding-left:0}
.slide.pair .pc:last-child{padding-right:0}
.slide.pair .pl{font-family:var(--mono);font-size:clamp(8px,1.4cqw,11px);letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted);margin-bottom:3.4cqw}
.slide.pair .pt{font-family:var(--disp);font-weight:700;text-transform:uppercase;
  font-size:clamp(13px,5.2cqw,70px);line-height:1.04;letter-spacing:-.015em;color:var(--ink);margin:0}

/* ===== траектория развития: один знак на весь блок =====
   Геометрия фиксирована и одинакова на всех экранах: меняется только подсветка,
   маркер и пунктир ожидаемого продолжения. Знак стоит на одном месте и в одном
   размере, поэтому при пролистывании читается как один объект, а не как новая кривая. */
.slide.climb,.slide.traj{justify-content:flex-start}
.slide.climb .tj,.slide.traj .tj{position:absolute;left:7.2cqw;right:7.2cqw;top:7.2cqw;bottom:7.2cqw;
  width:auto;height:auto;overflow:visible}
.slide.climb .tx,.slide.traj .tx{position:relative;z-index:1;width:46%}
.tj .sg{fill:none;stroke:#E2DED3;stroke-width:6;stroke-linecap:round}
.tj .sg.on{stroke:var(--ink);stroke-width:9}
.tj .gh{fill:none;stroke:#D8D3C6;stroke-width:4;stroke-dasharray:1 16;stroke-linecap:round}
.tj .vr2{fill:none;stroke-linecap:round}
.tj .nd{fill:var(--ink)}
.tj .dot{fill:var(--accent);stroke:var(--ink);stroke-width:5}
.tj .dotp{fill:#FFFFFF;stroke:#B4AF9F;stroke-width:4}
.tj .pl{stroke:#C4BEAE;stroke-width:2.6;stroke-linecap:round}
.tj .tl{font-family:var(--mono);font-size:26px;letter-spacing:.16em;fill:var(--ink2)}
.tj .tp{font-family:var(--mono);font-size:20px;letter-spacing:.13em;fill:var(--ink2)}
.tj .hr{font-family:var(--mono);font-size:24px;letter-spacing:.26em;fill:var(--muted)}
.slide.traj .bigw{font-family:var(--disp);font-weight:700;text-transform:uppercase;
  font-size:clamp(28px,15cqw,205px);line-height:.9;letter-spacing:-.02em;color:var(--ink);margin:0}
.slide.traj .tcap{font-family:var(--mono);font-size:clamp(8px,1.42cqw,11px);letter-spacing:.24em;
  text-transform:uppercase;color:var(--muted);margin-top:1cqw}
.slide.traj .subw{font-family:var(--disp);font-weight:500;text-transform:uppercase;
  font-size:clamp(12px,3.1cqw,40px);line-height:1.14;letter-spacing:.005em;color:var(--ink2);
  margin:3.2cqw 0 0;max-width:18ch}
/* ===== реплики узнавания ===== */
/* ===== реплики: знак стоит ВНУТРИ строки цитаты, как редакционный глиф =====
   Кегль задаётся ступенью по длине самой длинной строки, а не подгонкой под экран.
   Автофит отключён намеренно. Размер знака и отступ заданы в em от кегля цитаты,
   поэтому связь «знак при реплике» держится на всех ступенях. */
.slide.sayone{justify-content:center;padding-bottom:12cqw}
.slide.sayone .grp{max-width:70cqw}
.slide.sayone .tick{font-family:var(--mono);font-size:clamp(8px,1.42cqw,11px);letter-spacing:.24em;
  text-transform:uppercase;color:var(--muted);margin:0 0 2.4cqw}
.slide.sayone .row{display:flex;align-items:flex-start;gap:.5em}
.slide.sayone .zs{width:.62em;height:auto;flex:none;margin-top:.28em;overflow:visible}
.slide.sayone .qq{font-family:var(--disp);font-weight:700;text-transform:uppercase;
  font-size:1em;line-height:1.06;letter-spacing:-.02em;color:var(--ink);margin:0}
/* два равноправных состояния, без иерархии и без before/after */
/* расширяющиеся области включённости: вложенные территории, без иерархии и без шкалы */
.slide.rings{justify-content:center;align-items:center}
.slide.rings .rg{position:relative;width:100%;max-width:88cqw}
.slide.rings svg{width:100%;height:auto;display:block;overflow:visible}
.slide.rings .rl{font-family:var(--disp);font-weight:600;text-transform:uppercase;
  font-size:23px;letter-spacing:.01em;fill:var(--ink)}
.slide.rings .rl.far{fill:var(--muted)}
.slide.duo{justify-content:center}
.slide.duo .dg{display:grid;grid-template-columns:1fr 1px 1fr;align-items:center}
.slide.duo .vr{background:var(--rule);min-height:22cqw}
.slide.duo .dc{padding:0 6cqw}
.slide.duo .dc:first-child{padding-left:0}
.slide.duo .dc:last-child{padding-right:0}
.slide.duo .dt{font-family:var(--disp);font-weight:700;text-transform:uppercase;
  font-size:clamp(20px,8.4cqw,118px);line-height:.98;letter-spacing:-.022em;color:var(--ink);margin:0}
.slide.duo.sm .dt{font-size:clamp(14px,4.9cqw,66px);line-height:1.04}
.slide.duo.sm .vr{min-height:16cqw}

/* имя логики: слово получает экран целиком, поддержка заметно тише */
.slide.name{justify-content:center}
.slide.name .nw{font-family:var(--disp);font-weight:700;text-transform:uppercase;
  font-size:clamp(22px,9.2cqw,130px);line-height:.94;letter-spacing:-.024em;color:var(--ink);margin:0}
.slide.name .ns{font-family:var(--disp);font-weight:500;text-transform:uppercase;
  font-size:clamp(11px,2.7cqw,33px);line-height:1.22;letter-spacing:.005em;color:var(--ink2);
  margin:5cqw 0 0;max-width:30ch}
/* поле избытка: много слов разного кегля и тона, без иерархии и без сетки */
.slide.flood{justify-content:center}
.slide.flood .fl{display:flex;flex-wrap:wrap;align-items:baseline;gap:1.6cqw 2.6cqw}
.slide.flood .fl span{font-family:var(--disp);font-weight:600;text-transform:uppercase;
  line-height:1;letter-spacing:.005em}
.slide.saymany{justify-content:center}
.slide.saymany .sw{display:flex;flex-direction:column;gap:4.6cqw}
.slide.saymany .sq{font-family:var(--disp);font-weight:700;text-transform:uppercase;
  line-height:1.02;letter-spacing:-.018em;color:var(--ink);margin:0}

/* ===== уровни зова: один знак, растущая амплитуда ===== */
.slide.levels{justify-content:center;padding:4.6cqw 7.2cqw 10.5cqw}
.slide.levels .lgrid{display:grid;grid-template-columns:33fr 61fr;column-gap:6fr;align-items:center;position:relative;z-index:1}
.slide.levels .lt{font-family:var(--disp);font-weight:700;text-transform:uppercase;
  font-size:clamp(18px,6.1cqw,88px);line-height:.92;letter-spacing:-.022em;color:var(--ink);margin:0}
.slide.levels .lt b{color:var(--accent)}
.slide.levels .llead{font-family:var(--sans);font-size:clamp(9px,1.58cqw,15px);line-height:1.52;
  color:var(--ink2);margin:4.6cqw 0 0;max-width:30ch}
.slide.levels .lv{display:grid;grid-template-columns:3.4cqw 16.5cqw 1fr;column-gap:2.6cqw;align-items:center;
  padding:1.25cqw 0;border-top:1px solid var(--rule)}
.slide.levels .lv:last-child{border-bottom:1px solid var(--rule)}
.slide.levels .lnum{font-family:var(--mono);font-size:clamp(9px,1.5cqw,14px);letter-spacing:.04em;color:#B4AF9F}
.slide.levels .sig{width:100%;height:auto;display:block;overflow:visible}
.slide.levels .lname{font-family:var(--disp);font-weight:700;text-transform:uppercase;
  font-size:clamp(11px,1.96cqw,23px);line-height:1;letter-spacing:-.008em;color:var(--ink);margin:0}
.slide.levels .ld{font-family:var(--sans);font-size:clamp(8px,1.3cqw,13px);line-height:1.4;
  color:var(--muted);margin:.55cqw 0 0}
.slide.levels .mtn{position:absolute;left:0;right:0;bottom:0;height:20%;
  background:url('img/levels-mtn.png') center bottom/cover no-repeat;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 62%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 62%)}

.slide.terr{justify-content:center}
.slide.terr .tg{display:grid;grid-template-columns:1fr 1px 1fr;column-gap:0}
.slide.terr .vr{background:var(--rule);min-height:34cqw}
.slide.terr .col{padding:0 6.4cqw}
.slide.terr .col:first-child{padding-left:0}
.slide.terr .col:last-child{padding-right:0}
.slide.terr .ico{width:6.4cqw;max-width:62px;height:auto;display:block;margin-bottom:3.4cqw}
.slide.terr .ls span{position:relative;padding-left:2.4cqw}
.slide.terr .ls span::before{content:'';position:absolute;left:0;top:.62em;width:1.3cqw;max-width:13px;height:1px;background:#C9C4B6}
.slide.terr .t{font-family:var(--disp);font-weight:700;text-transform:uppercase;
  font-size:clamp(14px,3.5cqw,44px);line-height:1.02;letter-spacing:-.015em;color:var(--ink);margin:0}
.slide.terr .sub{font-family:var(--sans);font-weight:600;font-size:clamp(11px,2.05cqw,20px);
  line-height:1.35;color:var(--ink);margin:2.6cqw 0 0}

       {m:'ИСТ',t:'S21 мастера, внутренняя причина.'}],
  cav:'КРИТИЧНО: между колонками нет и не должно быть стрелки. Мы не утверждаем, что усложнение среды вызывает внутреннее исчерпание, и не утверждаем обратного. Это два самостоятельных процесса, которые иногда совпадают во времени.',
  vq:'две территории равного веса, разделённые тонкой вертикальной чертой. Черта разделяет, а не соединяет: никакой стрелки, никакой causality. Равные кегль, отступы и вес у обеих колонок.',
  vb:null,
  out:'Две независимые линии могут сойтись в одном человеке.',
  br:'Что это даёт в сумме?'}},

{block:B, nav:'Логика перестаёт нести', lay:'display', size:'sm',
 h:'И тогда привычная<br>достигательская логика<br>может перестать <b>«нести»</b>.',
 a:{fn:'собирает два процесса в одну человеческую ситуацию',
  src:[{m:'ИСТ',t:'S20 и S21 мастера: внешняя и внутренняя причины исчерпания прежней логики.'},
       {m:'ИСТ',t:'S19 мастера: логика Достигателя и есть та, что привела к сегодняшнему успеху.'}],
  cav:'Слово «нести» не заменяем на «работать», «функционировать», «быть эффективным». Человек всё ещё может прекрасно достигать результатов. Речь о том, что прежняя логика может перестать быть достаточной опорой для следующего участка пути.',
  vq:'один тезис, жёлтым выделено только «нести» в кавычках. Кавычки помечают, что слово взято в точном, не бытовом смысле.',
  vb:null,
  out:'Дело не в результативности, а в опоре.',
  br:'Здесь обычно возникает возражение.'}},

{block:B, nav:'Может, мне ещё рано', lay:'voice',
 vm:'реплика из зала',

 a:{fn:'озвучивает типичное возражение аудитории, не отвечая на него',

  vb:null,
  out:'Возражение названо вслух.',
  br:'Ответ: дело не в размере.'}},

{block:B, nav:'Не измеряется размером успеха', lay:'display', size:'sm',

  cav:'Не вводим критерии богатства, должности, возраста и масштаба бизнеса, в том числе чтобы их опровергнуть. Экран остаётся чистым тезисом.',
  vq:'три строки, жёлтым выделено «размером успеха»: акцент стоит на ложном мериле, которое мы снимаем.',

  out:'Порога достижений не существует.',
  br:'Два примера на разных полюсах масштаба.'}},

{block:B, nav:'Миллиард и пять лет', lay:'pair',
 left:{l:'один', t:'Больше не нужен следующий миллиард.'},
 right:{l:'другой', t:'Больше не хочет ещё пять лет быть маркетологом.'},
 a:{fn:'через контраст показывает независимость перехода от абсолютного масштаба достигнутого',
  src:[{m:'ИСТ',t:'S25 мастера: исчерпать логику можно при совершенно разных масштабах достигнутого.'},
       {m:'ИСТ',t:'S22 мастера: у совершенно разных людей прежняя мотивация перестаёт вести дальше при совершенно разных внешних масштабах успеха.'}],
  cav:'Оба примера равноправны. Человек с миллиардом не выше маркетолога, и это не социальное сравнение. Единственный смысл: критерий не размер результата.',
  vq:'две колонки строго одинакового веса, кегля и отступа, разделённые тонкой вертикальной чертой. Ни порядка, ни иерархии, ни нумерации: слева и справа просто два разных человека.',
  vb:null,
  out:'Критерий не размер результата.',
  br:'Тогда что на самом деле ставится на кон?'}},

{block:B, nav:'Что ставится на кон', lay:'question',
 q:'Если дело не в размере успеха, что тогда на самом деле ставится на кон?',

  src:[{m:'НАША',t:'Редакционный вопрос-мост.'}],

  vq:'зелёная черта и вопрос, ничего больше. Экран держит паузу перед ответом.',
  vb:null,
  out:'Вопрос открыт.',
  br:'Меняться может не только класс задач.'}},

{block:B, nav:'Развитие выглядит так', lay:'climb', size:'xs', marks:true,
 h:'Мы привыкли думать,<br>что развитие выглядит так.',
 a:{fn:'продолжает достигательскую картину мира, знакомую зрителю по формуле',
  src:[{m:'ИСТ',t:'S18 мастера: рамка «цель, план, усилие, результат».'},
       {m:'НАША',t:'Линейный подъём как презентационное изображение привычной картины роста.'}],
  cav:'Это не критика линейного роста и не подготовка к его опровержению. Экран показывает картину, которая у зрителя уже есть.',
  vq:'одна восходящая линия слева направо, на ней пять узлов с подписями. Осей, сетки и шкал нет: это графический жест, а не диаграмма. Движение читается вверх, потому что подписи идут по линии, а не столбиком.',
  vb:null,
  out:'Развитие выглядит как непрерывный подъём.',
  br:'И это долгое время работает.'}},

{block:B, nav:'Первый излом', lay:'traj', size:'xs', only:['rise','turn'],
 h:'Но ни одна траектория<br>не продолжается<br>по-прежнему <b>бесконечно</b>.',
 a:{fn:'впервые показывает траекторию развития целиком, как форму',
  src:[{m:'МЕТ',t:'Геометрия траектории с обложки книги, переведённая в графический знак.'},
       {m:'ИСТ',t:'Книга: переход меняет привычную линейную картину роста, за ним идёт переходный участок и пересборка.'}],
  cav:'Не говорим «траектория сломалась» и «вы падаете». Речь о том, что прежнее продолжение не гарантировано, а не о катастрофе. Слова «кризис», «индивидуалист», «стратег», «пересборка», «зов» здесь запрещены.',
  vq:'намеренно НЕ полный показ формы. На экране только подъём и начало заворота, дальше линия обрывается. Зритель должен увидеть ровно одно: линия перестала продолжаться так, как раньше. Всю петлю раскрываем следующим экраном, иначе весь смысл выдаётся одним кадром и драматургия умирает.',
  vb:null,
  out:'Прежнее продолжение не гарантировано.',
  br:'В чём тут парадокс?'}},

{block:B, nav:'Перестать расти по-старому', lay:'traj', size:'xs', ghost:true,
 h:'Иногда, чтобы продолжить расти,<br>приходится перестать<br>расти <b>по-старому</b>.',
 a:{fn:'формулирует главный парадокс метафоры',
  src:[{m:'ИСТ',t:'S02 мастера: развитие идёт не прямой А→Б, а спиралью, человек возвращается к похожим задачам на новом витке.'},
       {m:'ИСТ',t:'Книга: продолжение развития может потребовать смены самого способа развиваться.'},
       {m:'ИСТ',t:'S20 и S21 мастера: внешняя и внутренняя причины исчерпания прежней логики.'}],
  cav:'НЕ пишем «чтобы подняться, нужно сначала упасть». Разрушение не романтизируем, кризис обязательным не объявляем. Смысл только в смене способа развития, а не в обязательности падения.',
  vq:'пунктир это буквально вторая половина той самой линии, которую зритель видел два экрана назад: ожидаемое продолжение подъёма. Реальная траектория от неё отворачивается. Сравнение сделано наложением на один и тот же знак, а не таблицей и не двумя колонками. Жёлтым выделено только «по-старому».',
  vb:null,
  out:'Меняется не цель роста, а способ расти.',
  br:'Разберём карту по участкам.'}},

{block:B, nav:'Здесь всё знакомо', lay:'traj', size:'sm', hi:['rise'],

 h:'Здесь<br>всё знакомо.',
 a:{fn:'отмечает на карте тот участок, который мы уже разобрали',
  src:[{m:'ИСТ',t:'S18 мастера: рамка «цель, план, усилие, результат». S19: не обесценивать Достигателя.'}],
  cav:'Приглушённая часть траектории не обесценена, она просто ещё не разобрана. Слова вокруг линии не список свойств и не карточки.',
  vq:'подсвечен только первый восходящий участок, остальная траектория уведена в светло-бежевый. Пять слов набраны ОДНОЙ строкой прямо по кривой (textPath), а не подписями к точкам: это смысловое поле вдоль движения, а не разметка бизнес-графика. Ряд рифмуется с формулой Достигателя цель, план, усилие, результат.',

  br:'А дальше начинается незнакомое.'}},

{block:B, nav:'А потом что-то меняется', lay:'traj', size:'sm', from:250, upto:270,
 h:'А потом<br>что-то меняется.',
 a:{fn:'создаёт напряжение перед введением нового понятия',
  src:[{m:'ИСТ',t:'S20, S21 мастера: момент, когда прежняя логика начинает исчерпываться.'}],
  cav:'Ни «кризис», ни «падение», ни «исчерпание», ни «слом», ни «индивидуалист». Изменение проявляется очень по-разному, поэтому здесь оно намеренно не названо.',
  vq:'подсвечен короткий участок, который ведёт в верхнюю точку, на ней жёлтый маркер. Жёлтый работает буквально как точечный акцент: одна точка на всём экране. Слово «зов» здесь ещё не звучит.',
  vb:null,
  out:'В траектории есть момент смены направления.',
  br:'У этого момента есть имя.'}},

{block:B, nav:'Зов', lay:'full', img:'img/zov-scene.png',
 a:{fn:'впервые даёт имя моменту смены направления и переводит его из схемы в переживание',
  src:[{m:'КНИГА',t:'Понятие «зов» как начало перехода.'},
       {m:'ИСТ',t:'S23 мастера, раздел O каркаса: зов как раннее обнаружение перехода.'}],
  cav:'Определения не даём: строка описывает переживание, а не ставит диагноз. Виды зова не перечисляем. Сцена ночная, но не кризисная: ничего не рушится, человек цел, дом цел. Показан импульс, а не катастрофа.',
  vq:'кадр вместо карты. Человек лежит ночью в своей обычной комнате, а на потолке разворачивается дорога к горам и городу. Зов приходит внутрь привычной жизни, не ломая её. Крупное слово держит левую треть, строка под ним звучит как начало истории, а не как определение. Карта возвращается следующим экраном и продолжает вести навигацию.',
  vb:null,
  out:'У момента перехода есть имя: зов.',
  br:'И он не обязан выглядеть как катастрофа.'}},

{block:B, nav:'Зов · сигнал траектории', lay:'traj', size:'xs', upto:270,
 h:'Зов это сигнал,<br>что прежняя траектория<br>требует <b>внимания</b>.',
 a:{fn:'связывает зов с траекторией: сигнал относится к форме пути, а не к качеству человека',
  src:[{m:'ИСТ',t:'S47 мастера: зов это механизм обнаружения перехода, а не уровень.'},
       {m:'КНИГА',t:'Зов как раннее обнаружение перехода.'},
       {m:'ИСТ',t:'S23 мастера: зов открывает переходный участок.'}],
  cav:'КРИТИЧНО: не «траектория сломалась» и не «вы уже падаете». Зов может прозвучать очень рано и не равен кризису. Слово «внимание», а не «тревога».',
  vq:'карта на прежнем месте, подсвечена пройденная часть и жёлтая точка перелома. Экран переводит зов из переживания в координату: вот участок пути, о котором сигнал.',
  vb:null,
  out:'Зов указывает на участок траектории.',
  br:'И он не равен катастрофе.'}},

{block:B, nav:'Зов не всегда кризис', lay:'traj', size:'sm', upto:270, here:true,
 h:'Зов не всегда<br>похож на <b>кризис</b>.',
 a:{fn:'предохранитель перед раскрытием форм зова',
  src:[{m:'КНИГА',t:'Наряду с кризисным сценарием книга описывает и некризисные формы зова: новая эпоха, большая игра, творческий импульс и другие.'}],
  cav:'Ключевой экран против ложного вывода «если у меня ничего не разрушилось, значит, переход не про меня». Кризис как обязательное условие развития не подаём ни здесь, ни дальше.',
  vq:'после кадра карта возвращается на то же место и в том же размере, с той же жёлтой точкой. Здесь же стоит mono-пометка «вы здесь»: она относится к точке на карте, а не утверждает, что каждый в зале находится на этой стадии. Жёлтым в тексте выделено только слово «кризис»: акцент на том, что мы снимаем.',
  vb:null,
  out:'Переход может начаться без катастрофы.',
  br:'Тогда на что он похож?'}},

{block:B, nav:'У зова много голосов', lay:'traj', size:'sm', upto:270, pulse:true,
 h:'У зова<br>много <b>голосов</b>.',
 a:{fn:'открывает петлю в следующий блок: из одной точки возможно множество проявлений',
  src:[{m:'КНИГА',t:'Книга описывает зов не как одно состояние, а как набор очень разных сигналов: от кризиса до новой эпохи, большой игры и творческого импульса.'},
       {m:'ИСТ',t:'S23 мастера, раздел O каркаса: зов как раннее обнаружение перехода.'}],
  cav:'Виды зова здесь не называем и не считаем. Никакой причинной модели «проигнорировал зов, значит получишь кризис»: громкость зова мы ещё не вводили и такую связь не доказывали. Зов не диагноз и не обязательная стадия.',
  vq:'та же карта на том же месте, та же жёлтая точка. От неё расходятся пять очень тонких коротких штрихов разной длины: сигнал может прозвучать по-разному. Ни узлов на концах, ни стрелок, ни подписей, поэтому это не mind map и не схема. Жёлтым в тексте выделено только «по-разному».',
  vb:null,
  out:'Проявлений много, форма одна не задана.',
  br:'Послушаем, как они звучат.'}},

{block:B, nav:'Реплика · масштаб', lay:'sayone', tick:'зов звучит примерно так', sign:0,
 q:'«Масштаб не тот,<br>играю не с теми».',
 a:{fn:'реплика узнавания, вид «Большая игра»',
  src:[{m:'КНИГА',t:'Вид зова «Большая игра». Реплика дословно: «Масштаб не тот, играю не с теми». Трактовка: Тесно в текущем масштабе: тянет на уровень, которого сейчас нет.'}],
  cav:'Название вида на экране не показываем: сначала узнавание, классификация позже. Реплика это чужая прямая речь, а не тезис автора и не диагноз. Реплика не оценка партнёров и не высокомерие. Речь о тесноте масштаба, а не о том, что окружение плохое.',
  vq:'одна фраза на весь экран, кавычки отмечают чужую прямую речь. Mono-строка сверху один раз задаёт рамку на весь ряд. Над фразой тонкая пиктограмма: две вложенные окружности: нынешний масштаб внутри большего.',
  vb:null,
  out:'Ещё один голос, в котором можно себя узнать.',
  br:'Или как избыток, которому не хватает конструкции.'}},

{block:B, nav:'Реплика · не помещается', lay:'sayone', sign:1,
 q:'«Мне всё надо,<br>но я не<br>вывожу».',
 a:{fn:'реплика узнавания, вид «В меня не помещается»',
  src:[{m:'КНИГА',t:'Вид зова «В меня не помещается». Реплика дословно: «Мне всё надо, но я не вывожу». Трактовка: Энергии и запросов больше, чем вмещает нынешняя конструкция жизни.'}],
  cav:'Название вида на экране не показываем: сначала узнавание, классификация позже. Реплика это чужая прямая речь, а не тезис автора и не диагноз. Это не выгорание и не несобранность. Реплика про избыток, а не про нехватку ресурса.',
  vq:'одна фраза на весь экран и тонкая пиктограмма над ней: прямоугольник, который распирает изнутри в четыре стороны. Знак абстрактный, поэтому не подписывает вид, а только держит ритм. Ни имени вида, ни номера, ни расшифровки.',
  vb:null,
  out:'Ещё один голос, в котором можно себя узнать.',
  br:'Иногда зов приходит как давление снаружи.'}},

{block:B, nav:'Реплика · кризис', lay:'sayone', sign:2,
 q:'«Всё горит,<br>а я анекдоты<br>рассказываю».',

{block:B, nav:'Пять уровней зова', lay:'full', img:'img/levels-5.png',
 a:{fn:'показывает авторскую модель интенсивности сигнала как нарастание, а не как список',
  src:[{m:'ИСТ',t:'S50 мастера: пять уровней громкости зова.'},
       {m:'КНИГА',t:'Пять уровней зова, книга стр. 1055-1064. Полные формулировки: ИНТЕРЕС тянет к новому через вдохновение, но сигнал легко заглушается новой порцией работы. ЭМОЦИИ появляются апатия, скука, агрессия, вина, привычная деятельность перестаёт давать прежнее удовлетворение. НЕУСПЕХИ на ровном месте начинают появляться неудачи, то, что раньше работало, даёт сбои. ОТНОШЕНИЯ напряжение проявляется в семье, партнёрствах, команде, личной жизни. ТЕЛО сигнал доходит до телесного уровня: соматика, болезни, физические ограничения. Порядок и названия авторские, шестого уровня нет.'}],
  cav:'КРИТИЧНО: не причинная цепочка. Не утверждаем «не услышал интерес, значит заболеешь» и не утверждаем, что каждый проходит все пять. Болезнь не объявляется следствием проигнорированного зова. Это шкала силы сигнала, а не медицинская диагностика и не стадии.',
  vq:'один и тот же световой знак повторяется пять раз и нарастает: от тонкой нити до вихря с разлетающимися обломками. Читается как усиление одного сигнала, а не как пять отдельных пунктов. Жёлтый работает свечением и набирает силу вместе с амплитудой. Ни карточек, ни иконок, ни кардиограммы, ни медицинских изображений, ни красного.',
  vb:null,
  out:'Один сигнал, пять степеней громкости.',
  br:'Что из этого следует.'}},

{block:B, nav:'Заметить раньше', lay:'display', size:'sm',

 vars:[{rx:245,ry:255,tone:'ink'}],
 a:{fn:'второй кадр пассажа: та же форма, но заметно глубже и длиннее',
  src:[{m:'МЕТ',t:'Редакционная метафора. Глубина и длительность не измеряются и не предписываются.'}],
  cav:'Глубокая петля НЕ означает более развитого или более честного человека. Ни лет, ни нормы длительности не называем. Экран намеренно без текста: слово превратило бы различие в параметр.',
  vq:'кадр без единого слова. Работает только сравнение с предыдущим экраном: та же линия, тот же вход, другая форма. Молчание здесь и есть приём.',
  vb:null,
  out:'Та же форма может быть намного больше.',
  br:'А иногда делает лишний оборот.'}},

{block:B, nav:'Переход · лишний оборот', lay:'traj',
 vars:[{rx:185,ry:185,sweep:670,r2:[92,92],tone:'ink'}],
 a:{fn:'третий кадр пассажа: траектория делает дополнительный оборот перед выходом вверх',
  src:[{m:'МЕТ',t:'Наша визуальная метафора возвратности поиска. Формальная модель Торберта повторных кругов не содержит, и мы этого не утверждаем.'},
       {m:'КНИГА',t:'Пересборка редко удаётся с первой попытки: человек может вернуться к тем же вопросам.'}],
  cav:'Не утверждаем, что кругов обязательно несколько, и не считаем их. Лишний оборот не означает неудачу или откат. Подписей «1 круг», «2 круга» на экране нет и быть не должно.',
  vq:'третий кадр, тоже без текста. Спираль уходит внутрь и только потом выходит вверх. Пассаж закрывается формой, после него можно делать вывод словами.',
  vb:null,
  out:'Поиск бывает возвратным.',
  br:'Но разрушение не входит в условие.'}},

{block:B, nav:'Не обязательно всё разрушить', lay:'display', size:'sm',
 h:'Для перехода<br>не обязательно сначала<br><b>всё разрушить</b>.',
 a:{fn:'главный предохранитель всего блока петли',
  src:[{m:'ИСТ',t:'S53 мастера, экологичный сценарий: раньше заметить сигнал, сохранить важные части прежней жизни, не уничтожить предыдущую логику.'},
       {m:'КНИГА',t:'Наряду с кризисным сценарием описаны и некризисные формы зова.'},
       {m:'ИСТ',t:'Экологичность перехода, раздел P мастер-каркаса.'}],
  cav:'Ставится сразу после вариативности петли, чтобы разная глубина не прочиталась как «чем глубже, тем правильнее». Экологичный переход возможен именно потому, что сигналы можно замечать рано.',
  vq:'чистый тезис без траектории. После пяти экранов с формой нужен типографический выдох, иначе петля начинает читаться как сценарий обязательной катастрофы.',
  vb:null,
  out:'Разрушение не входит в условие перехода.',
  br:'Но заметить сигнал это ещё не переход.'}},

{block:B, nav:'Зов это ещё не переход', lay:'traj', size:'sm', upto:270,
 h:'Зов<br>это ещё<br>не <b>переход</b>.',
 a:{fn:'отделяет распознавание сигнала от самого перехода',
  src:[{m:'ИСТ',t:'S47 мастера: зов не равен переходу, это сигнал о нём.'},
       {m:'КНИГА',t:'Зов открывает переходный участок, но не является им. Сначала сигнал, потом движение.'},
       {m:'ИСТ',t:'S23 мастера: зов как раннее обнаружение перехода.'}],
  cav:'Не обесцениваем зов и не говорим, что заметить мало. Разделяем два разных события: увидеть сигнал и начать двигаться. Будущие стадии заранее не объясняем.',
  vq:'карта возвращается как главный объект. Подсвечена только пройденная часть и точка зова, дальше траектория уходит в светло-бежевый. Зритель видит, где именно он стоит, и что дорога дальше пока не прочитана.',
  vb:null,
  out:'Сигнал замечен, движение ещё не началось.',
  br:'Здесь заканчивается объяснение и начинается переживание.'}},

{block:B, nav:'Прежняя логика ещё с вами', lay:'traj', size:'xs', upto:332, passed:true,
 h:'Прежняя логика<br>ещё с вами.<br><br>Но прежней уверенности<br>в ней <b>уже нет</b>.',
 a:{fn:'первый шаг внутрь перехода: теряется определённость, а не компетентность',
  src:[{m:'ИСТ',t:'S20, S21 мастера: логика Достигателя начинает исчерпываться изнутри и снаружи.'},
       {m:'КНИГА',t:'Переход начинается не с потери способностей, а с изменения отношения к направлению движения.'}],
  cav:'КРИТИЧНО: Достигатель не сломался. Человек по-прежнему умеет ставить цели, планировать, действовать и достигать. Меняется отношение к направлению движения, а не уровень компетентности. Слово «уверенность» не заменять на «способность».',
  vq:'маркер впервые сходит с восходящего участка и уходит в переходный коридор. Точка зова осталась позади и стала полым кольцом, жёлтый маркер теперь ниже по траектории. Движение показано перемещением одной точки, без новых элементов.',
  vb:null,
  out:'Способности целы, определённость уходит.',
  br:'Как это звучит изнутри.'}},

{block:B, nav:'Реплика · зачем', lay:'sayone', tick:'изнутри это звучит так',
 q:'«Я могу достичь.<br>Но не понимаю,<br>зачем».',
 a:{fn:'первая реплика узнавания внутри перехода',
  src:[{m:'НАША',t:'Редакционная формулировка на основе S21 мастера: прежняя мотивация исчерпывается, появляется вопрос «а зачем».'}],
  cav:'Не симптом и не пункт диагностического теста. Это внутренняя мысль, а не признак расстройства. Способность достигать в реплике прямо подтверждена.',
  vq:'одна фраза на весь экран. Mono-строка сверху один раз задаёт рамку на весь короткий ряд. Пиктограмм здесь нет: знаки принадлежат блоку видов зова и сюда не переносятся.',
  vb:null,
  out:'Результат есть, смысла в нём меньше.',
  br:'И то, что радовало, тоже меняется.'}},

{block:B, nav:'Реплика · не радует', lay:'sayone',
 q:'«То, чего я хотел,<br>больше не радует<br>как раньше».',
 a:{fn:'вторая реплика: меняется отношение к собственным целям',
  src:[{m:'ИСТ',t:'S21 мастера: то, что раньше автоматически мотивировало двигаться к следующей цели, перестаёт драйвить.'}],
  cav:'Не выгорание, не депрессия, не апатия как диагноз. Речь о смене отношения к достигнутому, а не о потере способности радоваться вообще.',
  vq:'та же композиция, что и у соседней реплики, поэтому ряд читается как один голос в трёх тактах, а не как три разных утверждения.',
  vb:null,
  out:'Прежние цели перестают питать.',
  br:'И появляется развилка внутри.'}},

{block:B, nav:'Реплика · хочу ли туда', lay:'sayone',
 q:'«Я знаю,<br>как идти дальше.<br><br>Я не уверен,<br>что хочу туда идти».',
 a:{fn:'третья реплика, самая точная: знание пути и желание идти расходятся',
  src:[{m:'НАША',t:'Редакционная формулировка на основе S20 и S21 мастера: компетентность сохраняется, определённость направления уходит.'}],
  cav:'Ключевая реплика ряда. Она прямо удерживает рамку «способности целы»: человек ЗНАЕТ, как идти. Проблема не в умении, а в направлении.',
  vq:'две части фразы разделены паузой-пробелом: сначала уверенное утверждение, потом сомнение. Разрыв между строками и есть смысл экрана.',
  vb:null,
  out:'Знание пути и желание идти разошлись.',
  br:'У этого состояния есть имя.'}},

{block:B, nav:'Уже не · Ещё не', lay:'full', img:'img/uzhe-esche.png',
 a:{fn:'называет состояние перехода и открывает новый смысловой блок',
  src:[{m:'ИСТ',t:'S34 мастера: Индивидуалист это период пересборки, состояние неустойчивое.'},
       {m:'ИСТ',t:'Блок III мастер-архитектуры: «Между „уже не“ и „ещё не“».'},
       {m:'КНИГА',t:'Переходное состояние, в котором прежние основания уже не держат, а новые ещё не сложились.'}],
  cav:'КРИТИЧНО: обе части равноправны. «Уже не» не плохое, «ещё не» не хорошее. Ни красного, ни зелёного, ни before и after, ни стрелки между ними. Кадр показывает момент полёта, а не падение: человек в воздухе, а не внизу. Не читать как метафору кризиса.',
  vq:'две трапеции и человек между ними, в воздухе. Прежняя перекладина уже отпущена и осыпается, следующая ещё не в руках. Формулировки стоят по краям одинаковым кеглем и весом, между ними только пустота кадра, без стрелки и без направления от худшего к лучшему. Жёлтого нет намеренно: он выделил бы одну из половин.',
  vb:null,
  out:'У состояния есть имя.',
  br:'И главный вопрос начинает меняться.'}},

{block:B, nav:'Старое и новое', lay:'pair',
 left:{l:'уже не', t:'Старое больше не даёт прежней опоры.'},
 right:{l:'ещё не', t:'Новое пока не сложилось.'},
 a:{fn:'расшифровывает обе половины состояния, сохраняя их равенство',
  src:[{m:'ИСТ',t:'S34 мастера: период пересборки, прежняя опора ослабла, новая не сложилась.'},
       {m:'ИСТ',t:'Блок III мастер-архитектуры: между «уже не» и «ещё не».'}],
  cav:'Не обещаем, что новое обязательно сложится, и не пугаем, что старое рухнет. Обе формулировки описывают состояние, а не прогноз.',
  vq:'две колонки строго одинакового веса и кегля, mono-подписи повторяют формулу предыдущего экрана. Тот же приём, что на экране про миллиард и маркетолога, поэтому равноправие читается сразу.',
  vb:null,
  out:'Опоры нет ни сзади, ни впереди.',
  br:'И главный вопрос начинает меняться.'}},

{block:B, nav:'Ещё одна причина', lay:'display', size:'xs', nofit:true,
 h:'И есть ещё одна причина,<br>почему этот переход<br>непрост.',
 a:{fn:'открывает второй слой болезненности перехода: дело не только в утрате интереса',
  src:[{m:'ИСТ',t:'S38 мастера: переход Достигатель → Индивидуалист самый болезненный, потому что приходится отпустить то, что сделало успешным.'}],
  cav:'Это ЧАСТИЧНОЕ расставание с прежним способом организовывать себя, а не отказ от достигательских способностей. Позже прежняя логика интегрируется, а не уничтожается. Не усиливаем до «все обязательно переживают ужасный кризис» и не делаем болезненность одинаковой для всех.',
  vq:'тихий экран-подводка мелким кеглем. Он существует только чтобы следующий смысл прозвучал отдельно от предыдущих реплик про интерес и мотивацию.',
  vb:null,
  out:'У сложности перехода есть вторая причина.',
  br:'И она про ценность прежнего способа.'}},

{block:B, nav:'Он привёл вас сюда', lay:'display', size:'sm',
 h:'Прежний способ<br>жить и действовать<br>не просто привычен.<br><br>Он <b>привёл вас сюда</b>.',
 a:{fn:'удерживает уважение к Достигателю прямо перед разговором о страхе его отпустить',
  src:[{m:'ИСТ',t:'S38 мастера: приходится отпустить то, что сделало успешным.'},
       {m:'ИСТ',t:'S19 мастера: не обесценивать Достигателя.'}],
  cav:'Ставится ДО страхов намеренно. Если сначала показать страх, а потом ценность, страх прочитается как слабость. Здесь он читается как закономерная реакция на расставание с рабочим инструментом.',
  vq:'два такта с паузой, жёлтым только «привёл вас сюда». Акцент стоит на заслуге прежнего способа, а не на привычке.',
  vb:null,
  out:'Прежний способ не просто привычка, он результат.',
  br:'Поэтому отпускать его страшно.'}},

{block:B, nav:'Реплика · обгонят', lay:'sayone', tick:'и тогда изнутри звучит так',
 q:'«Если я перестану бежать,<br>меня обгонят».',
 a:{fn:'первый страх: скорость как условие сохранения позиции',
  src:[{m:'ИСТ',t:'S38 мастера, дословно из каркаса: «если перестану бежать — обгонят».'}],
  cav:'Это ЧАСТИЧНОЕ расставание с прежним способом организовывать себя, а не отказ от достигательских способностей. Позже прежняя логика интегрируется, а не уничтожается. Не усиливаем до «все обязательно переживают ужасный кризис» и не делаем болезненность одинаковой для всех.',
  vq:'та же композиция, что у реплик в начале блока: знак не ставим, рамку задаёт одна mono-строка на весь ряд. Голос тот же человек, поэтому грамматика экрана та же.',
  vb:null,
  out:'Страх потерять позицию.',
  br:'И потерять управляемость.'}},

{block:B, nav:'Реплика · развалится', lay:'sayone',
 q:'«Если я перестану<br>всё контролировать,<br>всё развалится».',
 a:{fn:'второй страх: контроль как условие устойчивости',
  src:[{m:'ИСТ',t:'S38 мастера, дословно из каркаса: «перестану контролировать — развалится».'}],
  cav:'Это ЧАСТИЧНОЕ расставание с прежним способом организовывать себя, а не отказ от достигательских способностей. Позже прежняя логика интегрируется, а не уничтожается. Не усиливаем до «все обязательно переживают ужасный кризис» и не делаем болезненность одинаковой для всех. Не утверждаем, что контроль надо бросить: речь о страхе, а не о рекомендации.',
  vq:'вторая реплика ряда, композиция не меняется. Накопление идёт содержанием, а не вёрсткой.',
  vb:null,
  out:'Страх потерять управляемость.',
  br:'И потерять само построенное.'}},

{block:B, nav:'Реплика · потеряю построенное', lay:'sayone',
 q:'«Если я перестану<br>ставить бизнес первым,<br>я потеряю построенное».',
 a:{fn:'третий страх, самый крупный: приоритет как условие сохранности результата',
  src:[{m:'ИСТ',t:'S38 мастера, дословно из каркаса: «перестану ставить бизнес первым — потеряю построенное».'}],
  cav:'Это ЧАСТИЧНОЕ расставание с прежним способом организовывать себя, а не отказ от достигательских способностей. Позже прежняя логика интегрируется, а не уничтожается. Не усиливаем до «все обязательно переживают ужасный кризис» и не делаем болезненность одинаковой для всех. Не призываем перестать ставить бизнес первым и не обещаем, что построенное сохранится само.',
  vq:'самая длинная реплика ряда закрывает его. После неё нужен авторский голос, иначе зритель останется внутри страха.',
  vb:null,
  out:'Страх потерять результат.',
  br:'И всё это закономерно.'}},

{block:B, nav:'Сложно отпускать', lay:'display', size:'sm',
 h:'Сложно отпускать то,<br>что сделало тебя<br><b>успешным</b>.',
 a:{fn:'авторский вывод, который снимает со страхов оттенок слабости',
  src:[{m:'ИСТ',t:'S38 мастера: это частичное расставание с прежним способом организовывать себя. Резко, страшно.'}],
  cav:'КРИТИЧНО: НЕ утверждаем, что Достигатель должен отказаться от контроля, от бизнеса или от целей. Смысл обратный: прежняя логика позже интегрируется, а не уничтожается. Болезненность не объявляется обязательной и одинаковой для всех.',
  vq:'короткий вывод после трёх реплик, жёлтым только «успешным». Слово «сложно», а не «страшно»: страх уже прозвучал голосом человека, автору повторять его не нужно.',
  vb:null,
  out:'Страх отпустить прежнее закономерен.',
  br:'Но есть важная деталь.'}},

{block:B, nav:'Одна важная деталь', lay:'display', size:'xs', nofit:true,
 h:'Но есть одна<br>важная деталь.',
 a:{fn:'тихий такт-подготовка перед главным предохранителем блока',
  src:[{m:'НАША',t:'Редакционный экран-пауза.'}],
  cav:'Экран намеренно пустой по содержанию. Он существует только чтобы следующий тезис прозвучал отдельно, а не слился с описанием состояния.',
  vq:'самый мелкий кегль на всём участке и много воздуха. Резкий контраст с соседними экранами и есть приём: после него следующий тезис читается как поворот.',
  vb:null,
  out:'Сейчас будет что-то важное.',
  br:'Компетентность никуда не делась.'}},

{block:B, nav:'Вы не разучились достигать', lay:'display', size:'sm',
 h:'Вы не разучились<br><b>достигать</b>.',
 a:{fn:'главный предохранитель блока: переход не равен утрате способности',
  src:[{m:'ИСТ',t:'S19 мастера: не обесценивать Достигателя. Прежняя логика остаётся доступной человеку.'},
       {m:'КНИГА',t:'Достигатель «благодаря своим волевым качествам и целеустремленности способен добиться успеха».'}],
  cav:'КРИТИЧНО: человек не слаб, не потерян, не выгорел и не стал неэффективным. Компетентность может сохраняться полностью. Формулировок «теперь достижения не важны», «надо перестать достигать», «внешний успех бессмыслен» не допускаем нигде на участке.',
  vq:'короткий тезис после почти пустого экрана. Жёлтым выделено «достигать»: акцент стоит на сохранённой способности, а не на отрицании.',
  vb:null,
  out:'Способность достигать цела.',
  br:'Но «могу» и «хочу» начали расходиться.'}},

{block:B, nav:'Могу и хочу', lay:'duo', size:'sm',
 left:'Вы всё ещё<br>можете.', right:'Но уже<br>не всё хотите.',
 a:{fn:'ключевой экран блока: разводит способность и мотивацию',

  vq:'вопрос набран тем же кеглем, цветом и в той же позиции, что и следующий за ним. Равенство держится именно версткой: если приглушить этот экран, зритель прочитает «старый вопрос хуже».',
  vb:null,
  out:'Прежний вопрос назван и не обесценен.',

  out:'Вопрос сменился, человек не изменился в качестве.',
  br:'Внимание разворачивается внутрь.'}},

  vb:null,
  out:'Энергия разворачивается с цели на себя.',
  br:'Меняется сама навигация.'}},

{block:B, nav:'Ориентир снаружи и внутри', lay:'display', size:'sm',

{block:B, nav:'Индивидуалист', lay:'name',
 w:'Индивидуалист.',

  cav:'КРИТИЧНО: Индивидуалист НЕ более хороший человек, а Достигатель НЕ поверхностный и НЕ устаревший. Предыдущая логика не уничтожается, она остаётся доступной. Определения не даём, характеристик не перечисляем, карту семи логик не возвращаем. Множественность идентичностей, интеграцию противоречий, Big AND и Стратега здесь не трогаем.',

{block:B, nav:'Духовный гипермаркет', lay:'full', img:'img/hypermarket.png',
 a:{fn:'вводит культурную метафору избытка способов искать себя и сразу показывает сам избыток',
  src:[{m:'ИСТ',t:'S33 мастера: формы исследования себя.'},
       {m:'НАША',t:'«Духовный гипермаркет» это наша редакционная метафора. Не термин Торберта, не термин книги, не характеристика Индивидуалистов.'},
       {m:'НАША',t:'Отделы в кадре: медитация, йога, ретриты, випассана, психотерапия, дзен, Юнг, дыхательные и телесные практики, осознанность, коучинг, предназначение, Human Design, астрология, тантра. Список редакционный.'}],
  cav:'КРИТИЧНО: мы НЕ утверждаем, что эти практики научно или духовно равноценны, относятся к одной методологии или обязательны для Индивидуалиста. Это не классификация и не рекомендация. Ни одну из них не высмеиваем: шутка направлена на ситуацию избыточного выбора, а не на сами практики и не на людей, которые их выбирают.',
  vq:'кадр делает работу сразу двух экранов: называет метафору вывеской и тут же показывает ассортимент рядами отделов. Человек с тележкой стоит спиной, держась за голову, посреди прохода: избыток выбора читается по позе, а не подписывается словами. Никакой эзотерической эстетики: обычный торговый зал, промышленный свет, стеллажи. Юмор держится на контрасте делового пространства и духовных вывесок.',
  vb:null,
  out:'Способов искать себя очень много, и это дезориентирует.',
  br:'И у этого есть причина.'}},

{block:B, nav:'Уезжают на Бали', lay:'card', img:'img/bali/f1.png',

  vb:null,
  out:'Есть риск потерять прежнюю силу.',
  br:'Но человек при этом не изменился.'}},

{block:B, nav:'Тот же человек', lay:'card', img:'img/bali/f4.png',

{block:B, nav:'Проблема не в Бали', lay:'card', img:'img/bali/f6.png',

/* ===== рендер ===== */
const stage=document.getElementById('stage');
const loc=c=>`<div class="loc"><span class="cd">${c}</span></div>`;

function build(s){
  const D=s.dark?' dark':'';
  const L=s.lay;
  const K=s.kick?`<div class="kick" style="margin-bottom:3.4cqw">${s.kick}</div>`:'';
  const N=s.note?`<p class="note">${s.note}</p>`:'';
  const BD=s.bd?`<p class="bd">${s.bd}</p>`:'';
  const CH=s.chain?`<div class="chain">${s.chain.map((x,i)=>`${i?'<i>→</i>':''}<span>${x}</span>`).join('')}</div>`:'';

  if(L==='accum'){
    const cls=['a','b','c','d','e'];
    return `<div class="slide accum ${s.mode||'fade'}${D}">${loc(s.code)}${K}
      ${s.h?`<h2 class="dsp sm">${s.h}</h2>`:''}
      <div class="alines">${s.lines.map((x,i)=>`<span class="st ${cls[i]||'e'}">${x}</span>`).join('')}</div>
      ${BD}</div>`;
  }
  if(L==='defs'){
    return `<div class="slide defs${s.solo?' solo':''}${D}">${loc(s.code)}${K}${s.h?`<h2 class="dsp xs">${s.h}</h2>`:''}
      <div class="dwrap">
        <div class="dc"><div class="dl">${s.left.l}</div><p class="dt">${s.left.t}</p></div>
        <div class="vr"></div>
        <div class="dc"><div class="dl">${s.right.l}</div><p class="dt">${s.right.t}</p></div>
      </div></div>`;
  }
  if(L==='roster'){
    const col=a=>`<div class="col">${a.map(n=>`<div class="rr"><div class="rn">${n}</div></div>`).join('')}</div>`;
    return `<div class="slide roster${D}">${loc(s.code)}
      <p class="lead">${s.lead}</p>
      <div class="rg">${col(s.left)}${col(s.right)}</div></div>`;
  }
  if(L==='optic'){
    const tail=s.portrait
      ? `<div class="attrow"><img src="${s.portrait}" alt="" onerror="this.style.display='none'"><div class="cap">${s.lvl2}</div></div>`
      : `<div class="lvl2">${s.lvl2}</div>`;
    return `<div class="slide optic${D}">${loc(s.code)}<h2 class="dsp${s.size?' '+s.size:''}">${s.h}</h2>
      ${tail}${N}</div>`;
  }
  if(L==='swap'){
    return `<div class="slide swap${D}">${loc(s.code)}
      <div class="pre">${s.pre}</div>
      <p class="q1">${s.q1}</p>
      <div class="rule"></div>
      <h2 class="q2">${s.q2}</h2></div>`;
  }
  if(L==='terr'){
    const ICO={
      level:`<svg class="ico" viewBox="0 0 48 48" fill="none" stroke="#17161A" stroke-width="1.6">
        <path d="M5 42h38"/><rect x="10" y="29" width="7.5" height="13"/>
        <rect x="21" y="21" width="7.5" height="21"/><rect x="32" y="11" width="7.5" height="31"/></svg>`,
      quality:`<svg class="ico" viewBox="0 0 48 48" fill="none" stroke="#17161A" stroke-width="1.6" stroke-linecap="round">
        <path d="M5 42h38"/><path d="M7 33c5.5 0 5.5-15 11-15s5.5 19 11 19 6-11 12-11"/></svg>`};
    const col=c=>`<div class="col">${ICO[c.ico]||''}<h3 class="t">${c.t}</h3><p class="sub">${c.sub}</p>
      <div class="ls">${c.items.map(x=>`<span>${x}</span>`).join('')}</div></div>`;
    return `<div class="slide terr${s.plain?' plain':''}${D}">${loc(s.code)}
      ${s.h?`<h2 class="hd">${s.h}</h2>`:''}
      <div class="tg">${col(s.left)}<div class="vr"></div>${col(s.right)}</div></div>`;
  }
  /* ===== КАНОНИЧЕСКАЯ ГЕОМЕТРИЯ ПЕТЛИ =====
     Одна форма на всю вторую половину: подъём слева, зона перелома, внешний
     нисходящий изгиб, нижнее кольцо, возврат к центру и сильный выход вправо вверх.
     Геометрия параметрическая, поэтому редакционные варианты (глубина, длина,
     повторный круг) строятся той же функцией, а не рисуются заново. */
  const RAD=d=>d*Math.PI/180;
  const EP=(cx,cy,rx,ry,a)=>[cx+rx*Math.cos(RAD(a)), cy+ry*Math.sin(RAD(a))];
  const ED=(rx,ry,a)=>[-rx*Math.sin(RAD(a)), ry*Math.cos(RAD(a))];
  const N2=v=>{const m=Math.hypot(v[0],v[1])||1;return [v[0]/m,v[1]/m];};
  const F=n=>n.toFixed(1);
  /* дуга эллипса кубиками по 90°. r2 задаёт конечные радиусы: если они меньше
     стартовых, дуга уходит внутрь спиралью, и повторный оборот виден отдельно */
  function earc(cx,cy,rx,ry,a0,a1,moveTo,r2){
    const RX2=r2?r2[0]:rx, RY2=r2?r2[1]:ry, span=a1-a0;
    const rat=a=>(a-a0)/(span||1);
    const rxA=a=>rx+(RX2-rx)*rat(a), ryA=a=>ry+(RY2-ry)*rat(a);
    let d='', a=a0;
    while(a<a1-0.001){

    return `<div class="slide formula${D}">${loc(s.code)}<h2 class="dsp xs">${s.h}</h2>
