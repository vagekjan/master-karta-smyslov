      ${s.flist?`<div class="flist">${s.flist.map(x=>`<span class="fi">${x}</span>`).join('')}</div>`:''}
      ${BD}</div>`;
  }
  if(L==='question'){
    return `<div class="slide question${D}">${loc(s.code)}<div class="qline"></div><h2 class="q">${s.q}</h2>
      ${s.nx?`<div class="nx">${s.nx}</div>`:''}</div>`;
  }
  return `<div class="slide display${D}">${loc(s.code)}<h2 class="dsp">${s.h||''}</h2></div>`;
}


/* сквозная нумерация: коды всегда соответствуют порядку в массиве */
/* границы блоков заданы якорями по названию экрана, а не индексами:
   II начинается с фокуса D→I→S (S17 каркаса),
   III с того места, где переход перестают объяснять снаружи и начинают проживать изнутри */
const BLK_FROM={'Где находится аудитория':'II', 'Прежняя логика ещё с вами':'III', 'Так что с ними делать':'IV', 'Вернёмся к траектории':'V'};
(function(){let b='I';const n={};
  SL.forEach(s=>{ if(BLK_FROM[s.nav])b=BLK_FROM[s.nav]; s.block=b;
    n[b]=(n[b]||0)+1; s.code=b+'.'+String(n[b]).padStart(2,'0'); });})();
stage.innerHTML=SL.map(build).join('');
const slides=[...stage.querySelectorAll('.slide')];
let pos=0;

/* ===== Architect ===== */
const mkLabel={'КНИГА':'источник · книга','ИСТ':'источник','НАША':'наша формулировка','МЕТ':'метафора','ФЛАГ':'требует проверки'};
const mkCls={'КНИГА':'ist','ИСТ':'ist','НАША':'nash','МЕТ':'met','ФЛАГ':'flag'};
function archHTML(s){
  if(!s.a)return `<div class="a-h">Architect</div><div class="a-v" style="color:#8C8677">Титульный слайд блока.</div>`;
  const f=(k,v)=>v?`<div class="a-f"><div class="a-k">${k}</div><div class="a-v">${v}</div></div>`:'';
  const src=s.a.src.map(x=>`<li><span class="mk ${mkCls[x.m]}">${mkLabel[x.m]}</span>${x.t}</li>`).join('');
  const vb=s.a.vb?`<div class="a-vb"><span class="t">visual brief · образ ещё не произведён</span>${s.a.vb.t}<span class="no">Не должно быть: ${s.a.vb.no}</span></div>`
                 :`<span style="color:#8C8677">отдельный образ не требуется, экран держится композицией</span>`;
  return `<div class="a-h">Architect · ${s.code}</div>
    ${f('Функция слайда',s.a.fn)}
    ${f('Опоры',`<ul>${src}</ul>`)}
    ${f('Ограничение',`<div class="a-cav"><span class="w">caveat</span>${s.a.cav}</div>`)}
    ${f('Что делает композиция',s.a.vq)}
    ${f('Visual brief',vb)}
    ${f('Что остаётся у зрителя',s.a.out)}
    ${f('Какой вопрос ведёт дальше',s.a.br)}`;
}

const brandEm=document.querySelector('.brand em');
/* ===== карта Master ===== */
const mnavIn=document.getElementById('mnavIn');
function buildNav(){
  const cur=SL[pos].block;
  let h=`<div class="mn-head">Архитектура Master</div>`;
  MASTER.forEach(b=>{
    const items=SL.map((s,i)=>({s,i})).filter(x=>x.s.block===b.r);
    const isCur=b.r===cur;
    h+=`<button class="${b.ready?(isCur?'mn-b cur':'mn-b'):'mn-b soon'}" data-b="${b.r}"${b.ready?'':' disabled'}>
      <span class="k">${b.r}</span><span class="nm">${b.name}</span><span class="st">${b.ready?items.length:'позже'}</span></button>`;
    if(isCur&&items.length){
      h+=`<div class="mn-items">`+items.map(x=>
        `<button class="mn-i" data-go="${x.i}"><span class="t">${x.s.code||'·'}</span><span>${x.s.nav||''}</span></button>`).join('')+`</div>`;
    }
  });
  mnavIn.innerHTML=h;
}
function syncNav(){
  mnavIn.querySelectorAll('.mn-i').forEach(b=>{
    const hit=+b.dataset.go===pos;
    b.classList.toggle('on',hit);
    if(hit&&document.body.classList.contains('navopen'))b.scrollIntoView({block:'nearest'});
  });
}
mnavIn.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){go(+g.dataset.go);return;}
  /* клик по заголовку готового блока ведёт на его первый экран и раскрывает список */
  const hb=e.target.closest('.mn-b');
  if(hb&&!hb.disabled&&hb.dataset.b){
    const i=SL.findIndex(x=>x.block===hb.dataset.b);
    if(i>=0)go(i);
  }
});
function fit(){
  const bd=document.body;
  if(!bd.classList.contains('navopen'))return;
  const archW=bd.classList.contains('architect')?340:0;
  if(window.innerWidth-archW-248-32<540)bd.classList.remove('navopen');
}
window.addEventListener('resize',fit);
function setNav(open){document.body.classList.toggle('navopen',open);fit();syncNav();}
document.getElementById('burger').onclick=()=>setNav(!document.body.classList.contains('navopen'));

/* ===== навигация ===== */
/* автоподгонка: заголовок плакатного экрана заполняет полосу набора */
function fitHead(el,slide){
  if(!el)return;
  const cs=getComputedStyle(slide);
  const avail=slide.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const maxH=slide.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const target=avail*0.94;
  el.style.fontSize='';
  const base=parseFloat(getComputedStyle(el).fontSize);
  const widest=()=>{const r=document.createRange();r.selectNodeContents(el);
    let m=0;for(const b of r.getClientRects())if(b.width>m)m=b.width;return m||1;};
  let fs=base;
  for(let i=0;i<7;i++){
    const k=target/widest();
    if(Math.abs(k-1)<0.02)break;
    fs=Math.max(14,Math.min(base*2.6,fs*k));
    el.style.fontSize=fs.toFixed(1)+'px';
  }
  /* ничего не должно выходить за слайд ни по высоте, ни по ширине */
  let guard=0;
  const over=()=>{
    const r=slide.getBoundingClientRect();
    if(slide.scrollHeight>Math.ceil(r.height)+1)return true;
    if(el.scrollWidth>el.clientWidth+1)return true;
    let bad=false;
    slide.querySelectorAll('*').forEach(e=>{const b=e.getBoundingClientRect();
      if(b.width>0&&(b.left<r.left-1||b.right>r.right+1||b.top<r.top-1||b.bottom>r.bottom+1))bad=true;});
    return bad;
  };
  while(over()&&guard++<40){fs*=0.94;el.style.fontSize=fs.toFixed(1)+'px';}
}
function fitActive(){
  const sl=slides[pos];if(!sl)return;
  if(sl.classList.contains('photoright')||sl.classList.contains('nofit')){return;}
  if(sl.classList.contains('inner')){fitHead(sl.querySelector('.qs'),sl);return;}
  if(sl.classList.contains('sayone')){return;}
  if(sl.classList.contains('display')||sl.classList.contains('guard')||sl.classList.contains('question')||sl.classList.contains('hor')||sl.classList.contains('zoomrow')||sl.classList.contains('optic')||sl.classList.contains('trap')||sl.classList.contains('field6')||sl.classList.contains('qfield')||sl.classList.contains('expand')||(sl.classList.contains('halves')&&!sl.classList.contains('photo'))){
    fitHead(sl.querySelector('.h2x, .dsp, .q'), sl);
  }
}
window.addEventListener('resize',()=>fitActive());

function render(){
  slides.forEach((el,i)=>el.classList.toggle('active',i===pos));
  document.getElementById('prev').disabled=pos===0;
  document.getElementById('next').disabled=pos===SL.length-1;
  document.getElementById('progbar').style.width=(pos/(SL.length-1)*100)+'%';
  const s=SL[pos];
  const mb=MASTER.find(x=>x.r===s.block);
  if(mb&&brandEm.textContent!=='· Блок '+s.block){
    brandEm.textContent='· Блок '+s.block;
    document.title='Блок '+s.block+' · '+mb.name+' · мастер-презентация смыслов';
    buildNav();
  }
  document.getElementById('mid').textContent=s.code+'   ·   '+(pos+1)+'/'+SL.length;
  document.getElementById('archIn').innerHTML=archHTML(s);
  fitActive();
  syncNav();
}
function go(i){pos=Math.max(0,Math.min(SL.length-1,i));render();}
document.getElementById('next').onclick=()=>go(pos+1);
document.getElementById('prev').onclick=()=>go(pos-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(pos+1);}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(pos-1);}
});
const bP=document.getElementById('bP'),bA=document.getElementById('bA');
bP.onclick=()=>{document.body.classList.remove('architect');bP.classList.add('on');bA.classList.remove('on');setNav(false);};
bA.onclick=()=>{document.body.classList.add('architect');bA.classList.add('on');bP.classList.remove('on');setNav(true);};

buildNav();
render();
</script>
</body>
</html>
